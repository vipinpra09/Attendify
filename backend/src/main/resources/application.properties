spring.application.name=attendify

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/AttendifyDB
spring.datasource.username=postgres
spring.datasource.password=Password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

jwt.secret=${JWT_SECRET:AttendifySecretKeyForHS256SigningMustBeAtLeastThirtyTwoBytesLong!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

attendify.min-attendance=75
attendify.cors.origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
